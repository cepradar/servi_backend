spring.application.name=inventory-backend

# ============================================================
# PERFIL ACTIVO
# Cambiar con:
#   - variable de entorno SPRING_PROFILES_ACTIVE
#   - argumento: --spring.profiles.active=production
# ============================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ============================================================
# CARGA DE CONFIGURACIÓN EXTERNA (opcional)
# ============================================================
spring.config.import=optional:file:./.env[.properties],optional:file:./config/application.properties

# ============================================================
# DATASOURCE — PostgreSQL
# ============================================================
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# FLYWAY — Migraciones de base de datos
# ============================================================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.locations=classpath:db/migration

# ============================================================
# JWT
# ============================================================

# ============================================================
# ACTUATOR / HEALTHCHECKS
# Exponer solo health/info y habilitar probes para Docker/Kubernetes.
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=never

# ============================================================
# SERVIDOR
# ============================================================
server.port=${SERVER_PORT:8080}

# ============================================================
# MULTIPART (uploads)
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# ALMACENAMIENTO DE REPORTES
# ============================================================
reports.storage.path=${REPORTS_STORAGE_PATH:./reports-storage}

# ============================================================
# LOGGING
# ============================================================
logging.level.com.inventory=INFO
spring.devtools.restart.enabled=false
