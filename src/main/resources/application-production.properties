# ============================================================
# inventory-backend — Perfil PRODUCTION
# Carga .env.production o variables reales del servidor.
# ============================================================
spring.config.import=optional:file:./.env.production[.properties],optional:file:./config/application-production.properties

app.cors.allowed-origin-patterns=${APP_CORS_ORIGINS}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=${FLYWAY_ENABLED:true}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
