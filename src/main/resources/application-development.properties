# ============================================================
# inventory-backend — Perfil DEVELOPMENT
# Carga .env.development y luego .env.local si existe.
# ============================================================
spring.config.import=optional:file:./.env.development[.properties],optional:file:./.env.local[.properties],optional:file:./config/application-development.properties

app.cors.allowed-origin-patterns=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.1.9:5173}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SERVI}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=${FLYWAY_ENABLED:false}

jwt.secret=${JWT_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
jwt.expiration=${JWT_EXPIRATION_MS:36000000}
